<svg width="340" height="90" viewBox="0 0 680 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iotadev-title iotadev-desc">
<title id="iotadev-title">iotaDev logo</title>
<desc id="iotadev-desc">A logo for iotaDev: a teal rounded-square badge containing a stylized Greek iota where the dot is rendered as a connected network node, next to the wordmark "iotaDev" with "iota" in dark gray and "Dev" in coral.</desc>

<rect x="40" y="40" width="140" height="140" rx="28" fill="#0B4F44"/>

<line x1="110" y1="76" x2="88" y2="60" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
<line x1="110" y1="76" x2="132" y2="60" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="88" cy="60" r="5" fill="#5DCAA5"/>
<circle cx="132" cy="60" r="5" fill="#5DCAA5"/>
<circle cx="110" cy="76" r="11" fill="#FFFFFF"/>
<rect x="102" y="98" width="16" height="62" rx="8" fill="#FFFFFF"/>

<text x="200" y="128" font-family="Arial, sans-serif" font-size="52" font-weight="500" fill="#2C2C2A">iota<tspan fill="#D85A30">Dev</tspan></text>
</svg>
