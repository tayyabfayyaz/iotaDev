services:
  - type: web
    name: iota-api
    runtime: python
    rootDir: software-house-website-v2/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_USER
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://iotadev.com,https://www.iotadev.com,https://iota-dev.vercel.app,https://iota-iota.vercel.app